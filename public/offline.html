<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Kasba Bazer</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #111827; text-align: center; padding: 24px; }
        @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f5f5f5; } }
        img { width: 96px; height: 96px; border-radius: 22px; }
        button { margin-top: 16px; padding: 10px 20px; border-radius: 8px; border: 0; background: #111827; color: #fff; font-size: 16px; cursor: pointer; }
        @media (prefers-color-scheme: dark) { button { background: #f5f5f5; color: #111827; } }
        p { color: #6b7280; max-width: 320px; margin: 8px auto 0; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Kasba Bazer">
        <h1>You are offline</h1>
        <p>Kasba Bazer needs an internet connection to load new posts. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
